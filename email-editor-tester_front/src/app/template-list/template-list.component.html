<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.6.1/font/bootstrap-icons.css"
/>
<button class="add-new" routerLink="/editor/0">+ New Template</button>
<table>
  <thead>
    <tr>
      <th>Template Name</th>
      <th>Creation Date</th>
      <div *ngIf="inSelect; else inList">
        <th>Select</th>
      </div>
      <ng-template #inList>
        <th>Update</th>
        <th>Delete</th>
      </ng-template>
      <th>Preview</th>
    </tr>
  </thead>
  <tbody>
    <tr
      *ngFor="
        let template of templates
          | paginate : { itemsPerPage: 8, currentPage: p }
      "
    >
      <td>{{ template.name }}</td>
      <td>{{ template.creationDate }}</td>
      <div *ngIf="inSelect; else inList">
        <td>
          <a (click)="handleSelect(template.id)" class="button"
            >Select <i class="bi bi-check2-circle"></i
          ></a>
        </td>
      </div>
      <ng-template #inList>
        <td>
          <button routerLink="/editor/{{ template.id }}">
            <i class="fas fa-edit"></i>
          </button>
        </td>
        <td>
          <button (click)="OnDeleteTemplate(template.id)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </ng-template>
      <td>
        <button (click)="preview(template.htmlData)">
          <i class="fas fa-eye"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>
<div class="text-center">
  <pagination-controls (pageChange)="p = $event"></pagination-controls>
</div>
